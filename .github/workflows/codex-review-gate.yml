name: Codex review gate

# Blocks merge while an unresolved Codex review comment carries severity P1,
# P2 or P3. P4 (and anything Codex's badge format doesn't parse) is advisory
# only and never blocks.
#
# Why this exists, and why it isn't simpler:
#
# The chatgpt-codex-connector GitHub App reviews every PR in this repo, but it
# never sets a review state GitHub can gate on natively — every one of its
# reviews comes back as COMMENTED, never APPROVED or CHANGES_REQUESTED, and it
# posts no check-run of its own. So "require Codex to pass" has no built-in
# signal to point a required status check at; this workflow manufactures one,
# reusing GitHub's own review-thread resolution as the source of truth (the
# same "Resolved" button a human clicks in the PR's Files Changed tab) rather
# than inventing a separate resolved/unresolved concept.
#
# Severity comes from the badge Codex puts at the top of each comment, e.g.
# `![P2 Badge](https://img.shields.io/badge/P2-yellow?style=flat)`. That
# format is Codex's, not this repo's, and could change — a comment whose
# badge this workflow can't parse is treated as advisory (logged, not
# blocking), because a merge gate that silently locks up over a formatting
# change it can't explain is worse than one that occasionally under-blocks.
#
# Two triggers, because "wait for an async bot" and "react to what it found"
# aren't the same event:
#   - pull_request: the PR opens or gets a new commit. Codex's own review may
#     not have landed yet, so this run polls briefly for at least one Codex
#     review before deciding.
#   - pull_request_review: fires the moment Codex (or anyone) submits a
#     review, including Codex's own re-review after a push — no need to poll.
#
# What this does NOT auto-trigger on: a human resolving a thread through the
# PR's "Resolve conversation" button. That action has no corresponding Actions
# event -- GitHub's `on:` triggers are a curated subset of its webhooks, and
# review-thread resolution isn't one of them (confirmed the hard way: an
# earlier draft of this file listed `pull_request_review_thread` as a third
# trigger, which is a real webhook GitHub Apps can subscribe to but not a
# workflow trigger, and it made this entire file invalid -- GitHub rejected it
# before scheduling a single job, for every event, not just that one). So
# after resolving threads, re-run this check from the PR's checks tab (or push
# an empty commit) to pick up the new state; there is no way around a manual
# nudge for that specific action without adding scheduled polling, which is
# more ongoing cost than a rarely-needed manual re-run justifies.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Codex review gate
    runs-on: ubuntu-latest
    steps:
      - name: Check for unresolved P1-P3 Codex findings
        uses: actions/github-script@v7
        with:
          script: |
            // No "[bot]" suffix here: that's a REST-API-only convention. The
            // GraphQL API this workflow queries returns the bare login for a
            // Bot actor -- confirmed by querying this exact field against a
            // real Codex comment before shipping this workflow, because
            // getting this wrong would make the gate silently never match a
            // single Codex thread.
            const CODEX_LOGIN = "chatgpt-codex-connector";
            const BLOCKING_MAX_SEVERITY = 3; // P1, P2, P3 block; P4+ is advisory
            const BADGE_PATTERN = /!\[P(\d+)\s*Badge\]/i;
            // The finding's title, which Codex bolds right after the badge:
            // `...</sub></sub>  Guard the browser install...**`. Falls back to
            // the raw first line if the badge markup ever changes shape, so a
            // format drift degrades the summary's readability rather than the
            // gate's correctness.
            const TITLE_PATTERN = /<\/sub><\/sub>\s*(.+?)\*\*/;

            // Only the `pull_request` trigger can fire before Codex has had a
            // chance to review the *current* head at all (a fresh open, or a
            // fresh push); the review trigger means Codex has just acted, so
            // there is nothing to wait for.
            const shouldPoll = context.eventName === "pull_request";
            const POLL_ATTEMPTS = 6;
            const POLL_DELAY_MS = 30_000; // 6 x 30s = 3 minutes, matching the
            // slowest Codex review latency observed on this repo's own PRs.

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // The bug this fixes, found by Codex reviewing this very file: the
            // original version treated "any Codex thread exists on the PR" as
            // "Codex has reviewed" -- but review threads outlive the commit
            // that prompted them. Once a PR has had a single Codex comment
            // ever, EVERY later `synchronize` run would see a non-empty thread
            // list immediately, skip the poll entirely, and evaluate against
            // whatever threads already existed -- even ones from commits
            // pushed minutes ago, before Codex had reviewed the new one. If
            // those happened to be the only threads and they were resolved,
            // the check went green in the same instant as the push, during
            // the exact window Codex was still working. A contributor could
            // merge in that window and the gate would never have looked at
            // their latest change at all.
            //
            // The fix: ask specifically whether Codex has submitted a review
            // against the current head SHA, not whether any thread exists
            // anywhere on the PR. `headRefOid` and each review's `commit.oid`
            // are both queried fresh, not read from the event payload, so this
            // is correct regardless of which of the two trigger types fired or
            // how stale that payload might be.
            async function fetchHeadSha() {
              const response = await github.graphql(
                `
                  query($owner: String!, $repo: String!, $pr: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $pr) { headRefOid }
                    }
                  }
                `,
                { owner, repo, pr: prNumber },
              );

              return response.repository.pullRequest.headRefOid;
            }

            async function codexHasReviewed(headSha) {
              let cursor = null;

              for (;;) {
                const response = await github.graphql(
                  `
                    query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $pr) {
                          reviews(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes { author { login } commit { oid } }
                          }
                        }
                      }
                    }
                  `,
                  { owner, repo, pr: prNumber, cursor },
                );

                const page = response.repository.pullRequest.reviews;

                if (
                  page.nodes.some(
                    (review) => review.author?.login === CODEX_LOGIN && review.commit?.oid === headSha,
                  )
                ) {
                  return true;
                }

                if (!page.pageInfo.hasNextPage) return false;
                cursor = page.pageInfo.endCursor;
              }
            }

            async function fetchCodexThreads() {
              const threads = [];
              let cursor = null;

              // Paginated on purpose: a large or long-lived PR can exceed one
              // page of review threads, and under-counting here would mean
              // silently missing a blocking finding.
              for (;;) {
                const response = await github.graphql(
                  `
                    query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $pr) {
                          reviewThreads(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes {
                              isResolved
                              comments(first: 1) {
                                nodes { author { login } body url }
                              }
                            }
                          }
                        }
                      }
                    }
                  `,
                  { owner, repo, pr: prNumber, cursor },
                );

                const page = response.repository.pullRequest.reviewThreads;
                threads.push(...page.nodes);

                if (!page.pageInfo.hasNextPage) break;
                cursor = page.pageInfo.endCursor;
              }

              return threads
                .filter((thread) => thread.comments.nodes[0]?.author?.login === CODEX_LOGIN)
                .map((thread) => {
                  const root = thread.comments.nodes[0];
                  const severityMatch = root.body.match(BADGE_PATTERN);
                  const titleMatch = root.body.match(TITLE_PATTERN);
                  const fallbackLine = root.body.split("\n").find((line) => line.trim());

                  return {
                    isResolved: thread.isResolved,
                    severity: severityMatch ? Number(severityMatch[1]) : null,
                    url: root.url,
                    summary: titleMatch?.[1]?.trim() || fallbackLine || "(no summary line)",
                  };
                });
            }

            const headSha = await fetchHeadSha();
            let reviewed = await codexHasReviewed(headSha);

            if (shouldPoll) {
              for (let attempt = 1; attempt <= POLL_ATTEMPTS && !reviewed; attempt += 1) {
                core.info(
                  `Codex has not reviewed ${headSha.slice(0, 7)} yet (attempt ${attempt}/${POLL_ATTEMPTS}) -- waiting ${POLL_DELAY_MS / 1000}s.`,
                );
                await sleep(POLL_DELAY_MS);
                reviewed = await codexHasReviewed(headSha);
              }
            }

            if (!reviewed) {
              core.setFailed(
                `Codex has not reviewed ${headSha.slice(0, 7)} (the current head) yet. This check ` +
                "re-runs automatically once a review lands on this commit specifically -- old threads " +
                "from earlier commits do not count, which is the point. One case this cannot detect: " +
                "if Codex reviewed this commit and found nothing at all, it leaves only a reaction, not " +
                "a review, and this check has no way to tell that apart from not having reviewed yet. " +
                "Confirm manually in the PR's activity if that seems likely, then re-run this check.",
              );
              return;
            }

            const codexThreads = await fetchCodexThreads();
            const unresolved = codexThreads.filter((thread) => !thread.isResolved);
            const blocking = unresolved.filter(
              (thread) => thread.severity === null || thread.severity <= BLOCKING_MAX_SEVERITY,
            );
            const advisory = unresolved.filter(
              (thread) => thread.severity !== null && thread.severity > BLOCKING_MAX_SEVERITY,
            );

            const summaryLines = [
              `Codex left ${codexThreads.length} finding(s) on this PR; ${unresolved.length} unresolved.`,
              "",
            ];

            if (blocking.length > 0) {
              summaryLines.push(`### Blocking (unresolved, severity <= P${BLOCKING_MAX_SEVERITY} or unparsed)`);
              for (const thread of blocking) {
                const label = thread.severity === null ? "unparsed severity" : `P${thread.severity}`;
                summaryLines.push(`- [${label}] ${thread.summary} — ${thread.url}`);
              }
              summaryLines.push("");
            }

            if (advisory.length > 0) {
              summaryLines.push(`### Advisory only (unresolved, severity > P${BLOCKING_MAX_SEVERITY} -- not blocking)`);
              for (const thread of advisory) {
                summaryLines.push(`- [P${thread.severity}] ${thread.summary} — ${thread.url}`);
              }
              summaryLines.push("");
            }

            await core.summary.addRaw(summaryLines.join("\n")).write();
            core.info(summaryLines.join("\n"));

            if (blocking.length > 0) {
              core.setFailed(
                `${blocking.length} unresolved Codex finding(s) at severity P${BLOCKING_MAX_SEVERITY} or ` +
                "stronger (or with an unparseable severity badge) must be resolved before this PR can merge. " +
                "Fix them and resolve the thread, or resolve it as a false positive if it does not apply.",
              );
            }
